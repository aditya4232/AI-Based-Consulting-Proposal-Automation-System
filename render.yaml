services:
  - type: web
    name: ai-proposal-generator
    env: python
    rootDir: proposal_generator
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PAI_TOKEN_SECRET
        generateValue: true
      # Do not set GROQ_API_KEY here to keep it secure.
      # Users must enter it in the frontend settings.
